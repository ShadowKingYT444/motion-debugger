name: Verify motion regression proof
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and video dependencies
        run: npx playwright install --with-deps chromium
      - name: Typecheck, build, and analysis tests
        run: npm run check
      - name: Real browser capture and UI smoke tests
        run: npm run test:e2e
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motion-evidence-${{ github.sha }}
          path: |
            artifacts/runs/
            artifacts/qa/
          if-no-files-found: warn
          retention-days: 7
