name: Motion Debugger CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install FFmpeg and ffprobe
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Chromium and video dependencies
        run: npx playwright install --with-deps chromium
      - name: Select version-matched Chromium for direct native fixtures
        run: |
          node --input-type=module -e 'import { chromium } from "playwright"; const executable = chromium.executablePath(); console.log(`MOTION_CHROME_PATH=${executable}`);' >> "$GITHUB_ENV"
      - name: Typecheck, build, and analysis tests
        run: npm run check
      - name: Real browser capture and UI smoke tests
        run: npm run test:e2e
      - name: Agent integration and temporal contract verification
        run: npm run test:v2:e2e
      - name: Lifecycle integrity browser regression
        run: npm run test:coverage:browser && npm run test:failure:browser
      - name: Page critique detects seeded defects and passes the kit-built control
        run: npm run test:critique:browser
      - name: Motion kit wires client-rendered (React/Next.js) mounts
        run: npm run test:kit:browser
      - name: Skill's documented GSAP/Lenis motion stack and shader run cleanly
        run: npm run test:stack:browser
      - name: Actor, review, authoring and transition upgrade regressions
        run: npm run test:actors:browser && npm run test:review:browser && npm run test:authoring:browser && npm run test:transitions:browser
      - name: Native construction recipes and positive task outcomes
        run: |
          npm run test:recipes:browser
          npm run test:colony:browser
          npm run test:sequence:browser
          npm run test:kinetic:browser
          npm run test:drag:browser
          npm run test:duration:browser
          npm run test:outcomes:browser
      - name: ASSEMBLY native journeys and idle render regression
        run: npm run test:assembly:browser
      - name: Fresh packed consumer install and real browser smoke
        run: npm run test:install
      - name: Record the premium-motion A/B comparison films from the committed sites
        run: node demos/record.mjs --out artifacts/showcase --no-gif
      - name: Upload browser evidence
        if: always()
        # Evidence upload is supplementary: a full Actions storage quota must not turn a passing
        # verification red. Test outcomes above remain authoritative.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: motion-evidence-${{ github.sha }}
          path: |
            artifacts/showcase/
            artifacts/runs/
            artifacts/qa/
            artifacts/v2/
            artifacts/install/
            artifacts/assembly/
          if-no-files-found: warn
          retention-days: 7
  pack:
    # One tarball, built once, is what every platform below installs: the same file the release attaches.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pack the CLI (prepack builds it)
        run: npm pack && mv motion-debugger-*.tgz motion-debugger.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: cli-tarball-${{ github.sha }}
          path: motion-debugger.tgz
          retention-days: 3
  platforms:
    # The packed CLI, installed outside the source tree with its own dependencies, downloads its
    # browser and critiques a real page on Linux, macOS and Windows.
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: cli-tarball-${{ github.sha }}
          path: ${{ runner.temp }}/cli
      - name: Install the tarball outside the source tree
        working-directory: ${{ runner.temp }}
        run: npm install -g ./cli/motion-debugger.tgz && motion-debugger --version
      - name: Download the version-matched browser through the CLI
        run: motion-debugger setup --browser
      - name: Critique a real page
        run: |
          motion-debugger critique demos/norr/upgraded --desktop-only --json --out "$RUNNER_TEMP/critique" > "$RUNNER_TEMP/report.json"
          node -e "const r=require(process.argv[1]);const images=Object.keys(r.images||{});if(typeof r.score!=='number'||!images.length)throw new Error('critique produced no score or screenshots');console.log('score',r.score,'grade',r.grade,'screenshots',images.length)" "$RUNNER_TEMP/report.json"
      - name: README skill one-liner without Node (bash)
        if: runner.os != 'Windows'
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p readme-bash && cd readme-bash
          mkdir -p .agents/skills && git clone --depth 1 https://github.com/ShadowKingYT444/motion-debugger.git /tmp/motion-debugger && cp -r /tmp/motion-debugger/plugin/motion-debugger/skills/premium-motion .agents/skills/
          test -f .agents/skills/premium-motion/SKILL.md && test -f .agents/skills/premium-motion/commands/upgrade.md
      - name: README skill one-liner without Node (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          New-Item -ItemType Directory -Force readme-pwsh | Out-Null; Set-Location readme-pwsh
          git clone --depth 1 https://github.com/ShadowKingYT444/motion-debugger.git $env:TEMP\motion-debugger; $null = New-Item -ItemType Directory -Force .agents\skills; Copy-Item -Recurse $env:TEMP\motion-debugger\plugin\motion-debugger\skills\premium-motion .agents\skills\
          if (-not (Test-Path .agents\skills\premium-motion\SKILL.md) -or -not (Test-Path .agents\skills\premium-motion\commands\upgrade.md)) { throw 'skill not installed' }
