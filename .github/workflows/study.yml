name: Paired agent study
on:
  pull_request:
    paths:
      - 'studies/**'
      - 'scripts/study/**'
      - '.github/workflows/study.yml'
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Run requested evidence episodes
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('studies/aer/requests.json'));for(const f of p.requests){const r=require('child_process').spawnSync(process.execPath,['scripts/study/run.mjs',f],{stdio:'inherit'});if(r.status)process.exit(r.status)}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paired-study-${{ github.sha }}
          path: artifacts/study/
          retention-days: 7
