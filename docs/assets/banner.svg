<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="title desc"><title id="title">Motion Debugger</title><desc id="desc">Build motion. Watch it. Make it better. An original motion path illustrated in amber against ink blue.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#93a4bf" opacity=".12"/></pattern></defs><rect width="1280" height="600" rx="16" fill="#111a2b"/><rect width="1280" height="600" fill="url(#grid)"/><g font-family="Arial,Helvetica,sans-serif"><text x="74" y="85" font-size="15" letter-spacing="5" fill="#ffb33d">MOTION DEBUGGER</text><text x="70" y="210" font-size="76" font-weight="700" letter-spacing="-3" fill="#f5f1e8">Interfaces</text><text x="70" y="296" font-size="76" font-weight="700" letter-spacing="-3" fill="#f5f1e8">that move.</text><text x="76" y="367" font-size="23" fill="#a6b5ca">Built with your agent. Seen in your browser.</text><text x="76" y="512" font-size="14" letter-spacing="3" fill="#a6b5ca">CREATE / WATCH / REFINE</text></g><g fill="none"><path d="M770 450C690 230 1000 100 1088 233S1198 408 1112 493" stroke="#44546b" stroke-width="28"/><path d="M770 450C690 230 1000 100 1088 233S1198 408 1112 493" stroke="#ffb33d" stroke-width="3"/><path d="M777 450C691 220 1000 112 1088 233S1198 408 1112 493" stroke="#ffb33d" stroke-width="2" stroke-dasharray="2 13" opacity=".7"/></g><g fill="#ffb33d"><circle cx="770" cy="450" r="7"/><circle cx="1088" cy="233" r="9"/><circle cx="1112" cy="493" r="7"/></g><rect x="857" y="133" width="95" height="46" rx="13" transform="rotate(-17 900 158)" fill="#f5f1e8"/><rect x="867" y="143" width="53" height="26" rx="6" transform="rotate(-17 900 158)" fill="#ffb33d"/></svg>