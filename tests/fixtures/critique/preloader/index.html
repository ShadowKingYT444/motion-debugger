<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preloader fixture</title>
<style>
  /* Seeded condition: a preloader locks scrolling for 4.5 s, past the critic's 3 s entrance window. */
  html.loading, html.loading body { overflow: hidden; height: 100%; }
  body { margin: 0; font: 18px/1.5 system-ui, sans-serif; background: #f4f1ea; color: #151513; }
  #loader { position: fixed; inset: 0; display: grid; place-items: center; background: #151513; color: #f4f1ea; font-size: 48px; transition: opacity 400ms ease-out; }
  html:not(.loading) #loader { opacity: 0; pointer-events: none; }
  section { min-height: 100vh; padding: 120px 8vw; box-sizing: border-box; border-top: 1px solid #ddd; }
</style>
<script>document.documentElement.classList.add('loading');setTimeout(()=>document.documentElement.classList.remove('loading'),4500);</script>
</head><body>
  <div id="loader" aria-hidden="true">Loading</div>
  <section><h1>Preloader fixture</h1><p>The page cannot scroll until the preloader finishes.</p></section>
  <section><h2>Second chapter</h2></section><section><h2>Third chapter</h2></section><section><h2>Fourth chapter</h2></section>
</body></html>
