<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crafted control</title>
<script>document.documentElement.classList.add('mk-js')</script>
<link rel="stylesheet" href="motion-kit.css"><script src="motion-kit.js" defer></script>
<style>
  body { margin: 0; background: #0e1111; color: #ecebe6; font: 17px/1.55 ui-sans-serif, system-ui, sans-serif; }
  section { min-height: 90vh; padding: 120px 8vw; box-sizing: border-box; overflow-x: clip; }
  h1 { font-size: clamp(3rem, 7vw, 6rem); line-height: 1; letter-spacing: -.04em; margin: 0 0 24px; max-width: 14ch; }
  h2 { font-size: clamp(2rem, 4vw, 3.25rem); letter-spacing: -.02em; margin: 0 0 32px; }
  p { max-width: 60ch; color: #b9b8b2; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .tile { min-height: 200px; border: 1px solid #2c3030; border-radius: 16px; padding: 24px; background: #151818; transition: transform var(--dur-ui) var(--ease-out-soft), border-color var(--dur-ui) linear; }
  .tile:hover { transform: translateY(-4px); border-color: #e8ff59; }
  .btn { display: inline-block; padding: 14px 24px; min-height: 44px; box-sizing: border-box; background: #e8ff59; color: #111; border-radius: 999px; text-decoration: none; }
  .btn:hover { background: #f3ffa8; }
  a { color: #ecebe6; }
  .stage { position: sticky; top: 0; height: 100vh; display: grid; place-items: center; }
  .stage div { width: 200px; height: 200px; border-radius: 24px; background: #e8ff59; transform: rotate(calc(var(--p, 0) * 180deg)) scale(calc(.6 + var(--p, 0) * .4)); }
  @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
</style></head>
<body>
  <section><p data-reveal="fade">Crafted control fixture</p><h1 data-split="words">Motion that explains the product</h1>
    <p data-reveal="up" data-delay="500">A page built from the premium-motion kit, used as the passing control for the critique suite.</p>
    <div data-stagger="80" data-delay="600"><a class="btn mk-button" href="#start">Get started</a> <a class="mk-link" href="#more">Read more</a></div></section>
  <section><h2 data-split="lines">Every section arrives with intent</h2>
    <div class="grid" data-stagger="70"><article class="tile" data-spotlight><h3>One</h3></article><article class="tile" data-spotlight><h3>Two</h3></article><article class="tile" data-spotlight><h3>Three</h3></article></div></section>
  <section data-progress style="height: 200vh; padding: 0"><div class="stage"><div></div></div></section>
  <section><h2 data-reveal="up"><span data-count="1280">0</span> teams</h2><p data-reveal="up">Numbers count up when they arrive.</p>
    <figure style="margin:0"><div data-reveal="clip" style="height:160px;border-radius:16px;background:linear-gradient(120deg,#1d2424,#2f3a2a)" role="img" aria-label="Clip-revealed visual"><p style="margin:0;padding:24px">Clip-revealed visual</p></div></figure></section>
</body></html>
